# --- Core settings ---------------------------------------------------------

# Optional, but usually nice to set explicitly
line-length = 88
target-version = "py310"

# --- Lint rule selection ---------------------------------------------------

include = [
    "pyproject.toml",
    "go2_robot_sdk/webrtc_relay/.py"
]

[lint]
select = [
    "ALL"
]

ignore = [
    "ANN204", "ANN401", "ANN002", "ANN003",
    "D",
    "W",
    "G004",
    "PLR2004",
    "UP035", "UP045", "UP037",
    "COM812",
    "I001",
    "N818",
    "FBT001", "FBT002", "FBT003", # reenable
    "RET501", "RET505",
    "TC001", "TC002", "TC003", # consider reenabling
    "TC006", # don't reenable
    "PYI034", # reenable
    "C901",
    "PLR0912", "PLR0915",
    "ANN201", "ANN202", # reenable
    "TRY003", "EM101", "EM102",
    "TRY300",
    "BLE001", # reenable
    "RET504", "RET503",
    "SIM108", "SIM102", "SIM910", "SIM212", "SIM117", "SIM105",
    "C401",
    "S608",
    "ERA001",
    "TD002", "TD003", "TD004", "FIX002",  # might be worth disabling everything here
    "PERF",
    "PIE790",
    "PT011", "PT003",
    "E501", # re-enable this after increasing line-length to 100
    "PLW2901",
    "SLOT000", "SLOT001",
    "INP001", # reenable this
    "F541",
]

[lint.per-file-ignores]
"**/tests/*" = [
    # Ignore specific rules
    "S101",   # Use of assert
    "ANN001",  # arg annotation
    "ARG001",  # unused args
    "PERF",
    "S110", # try-except-pass
    "PLR2004", # magic numbers
    "T201", # print is ok
]
"**/conftest.py" = [
    # Ignore specific rules
    "S101",   # Use of assert
    "ANN001",  # arg annotation
    "ARG001",  # unused args
    "PERF",
    "S110", # try-except-pass
    "PLR2004", # magic numbers
    "T201", # print is ok
]
"parapro_app/parapro/core/qt/**" = [
    "PGH003", # this folder is full of blanket ignores. Maybe disable one day
]
"parapro_app/parapro/core/cad/step.py" = ["ALL"]


[lint.pylint]
max-args = 6