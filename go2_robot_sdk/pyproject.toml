[project]
name = "go2-robot-sdk"
version = "0.1.0"
description = "establish connection to unitree go2 and expose data over webrtc and http"
authors = []
license = {text = "BSD-3-Clause"}
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "aioice",
    "numpy ~=1.26",
    "pydantic ~=2.0",
    "PyYAML ~=6.0",
    "wasmtime ~=37.0",
    "pycryptodome ~=3.23",
    "aiortc == 1.9",
    "requests ~=2.32",
    "lz4 ~=4.0",
]

[tool.uv.sources]
aioice = { git = "https://github.com/legion1581/aioice.git", branch = "go2" }


[tool.uv.build-backend]
module-name = "go2_robot_sdk"
module-root = ""


[build-system]
requires = ["uv_build>=0.10.8,<0.11.0"]
build-backend = "uv_build"