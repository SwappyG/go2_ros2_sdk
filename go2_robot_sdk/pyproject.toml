[project]
name = "go2-robot-sdk"
version = "0.1.0"
description = "establish connection to unitree go2 and expose data over webrtc and http"
authors = []
license = {text = "BSD-3-Clause"}
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "aioice",
    "numpy ~=1.26",
    "pydantic ~=2.0",
    "PyYAML ~=6.0",
    "wasmtime ~=37.0",
    "pycryptodome ~=3.23",
    "aiortc == 1.9",
    "requests >= 2.32, < 3",
    "av < 17",
    "aiohttp >= 3.13, <= 4",
    "fastapi[standard] >= 0.119, < 1",
    "opencv-python >=4.11, < 5",
    "httpx >= 0.28, < 1",
    "qasync",
    "PySide6 >=6.6, <7",
    "open3d >= 0.19, < 1",
    "vtk",
    "keyboard >= 0.13, < 1",
    "firebase-admin (>=7.1.0,<8.0.0)",
    "lz4 >=4.0, <5",
    "requests ~=2.32",
]

[tool.uv.sources]
aioice = { git = "https://github.com/legion1581/aioice.git", branch = "go2" }


[tool.uv.build-backend]
module-name = "go2_robot_sdk"
module-root = ""


[build-system]
requires = ["uv_build>=0.10.8,<0.11.0"]
build-backend = "uv_build"