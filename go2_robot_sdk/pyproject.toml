[project]
name = "go2-robot-sdk"
version = "0.1.0"
description = "establish connection to unitree go2 and expose data over webrtc and http"
authors = []
license = {text = "BSD-3-Clause"}
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "aioice @ git+https://github.com/legion1581/aioice.git@go2",
    "numpy >=1.26, < 2",
    "pydantic >=2.12, < 3",
    "PyYAML >=6.0, < 7",
    "wasmtime >=37, < 38",
    "pycryptodome >=3.23, < 4",
    "aiortc == 1.9",
    "requests >= 2.32, < 3",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
